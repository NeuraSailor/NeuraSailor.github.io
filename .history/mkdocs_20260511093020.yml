site_name: NeuraSailor 知识花园
site_description: 基于 Obsidian + MkDocs 的个人知识管理站
site_author: NeuraSailor
repo_url: https://github.com/NeuraSailor/Garden
edit_uri: ""

theme:
    name: 'material'
    language: zh
    palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "#FFD700"    
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

    features:
      - navigation.instant*****55
      - navigation.sections
      - navigation.expand
      - toc.integrate
      - search.suggest
      - search.highlight
      - content.code.copy

# Extensions
markdown_extensions:
  - footnotes
  - attr_list
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - en
        - zh
  # roamlinks 已禁用 - wikilinks 在转换脚本中处理

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NeuraSailor
  fonts:
    - name: LXGW WenKai
      styles: normal
      url: https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css
    - name: Noto Serif SC
      styles: [400, 600, 700]
      weights: [400, 600, 700]
  alternate_style: true
