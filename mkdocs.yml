site_name: NeuraSailor 知识花园
site_description: 基于 Obsidian + MkDocs 的个人知识管理站
site_author: NeuraSailor
repo_url: https://github.com/NeuraSailor/Garden
edit_uri: ""

theme:
    name: 'material'
    custom_dir: overrides
    language: zh
    palette:

    # Light mode — manual toggle
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式

    # Dark mode — manual toggle
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

    features:
      - navigation.instant
      - navigation.tracking
      - navigation.sections
      - navigation.expand
      - navigation.indexes
      - navigation.top
      - toc.follow
      - search.suggest
      - search.highlight
      - content.code.copy

# Extensions
markdown_extensions:
  - footnotes
  - attr_list
  - admonition
  - tables
  - abbr
  - md_in_html
  - nl2br
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 5
      permalink_title: 点击此处可置顶内容
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

plugins:
  - statistics:
      words_per_minute: 200
  - search:
      lang:
        - zh
        - en
        - ja
      separator: '[\s​\-]'
  - callouts:
      aliases: true
  - ezlinks

exclude_docs: |
  .obsidian/*
  .claude/*

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/extra.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js

extra_css:
  - stylesheets/fonts.css
  - stylesheets/hogwarts.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NeuraSailor
  fonts:
    - name: ZCOOL XiaoWei
      styles: normal
      url: https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap
    - name: Noto Serif SC
      styles: [400, 600, 700]
      weights: [400, 600, 700]
  alternate_style: true
